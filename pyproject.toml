[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "fullmark"
version = "1.0.0"
description = "Convert ANY source format into a perfect Markdown file"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "tmprabubiz" }]
requires-python = ">=3.11"
dependencies = [
    "pdfplumber>=0.11.0",
    "pdfminer.six>=20221105",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.2",
    "python-pptx>=1.0.2",
    "ebooklib>=0.18",
    "striprtf>=0.0.26",
    "extract-msg>=0.48.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "markdownify>=0.12.1",
    "youtube-transcript-api>=0.6.2",
    "feedparser>=6.0.11",
    "Pillow>=10.3.0",
    "pytesseract>=0.3.10",
    "openai-whisper>=20231117",
    "PySceneDetect>=0.6.3",
    "opencv-python>=4.9.0",
    "openai>=1.30.0",
    "python-dotenv>=1.0.1",
    "click>=8.1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
fullmark = "fullmark_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["fullmark*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
